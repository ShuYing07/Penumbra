name: Compliance Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  forbidden-words:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 扫描对外文档中的营销性承诺
        run: |
          set -e
          # 合规护栏只拦"对外可见文档里的营销性承诺"。
          # 故意不包含"荐股/买入/卖出"等词：
          #   - 文档里"本工具不荐股""不是荐股软件"是合法合规声明；
          #   - 回测/模拟盘代码里的"买入/卖出"是交易动作的工程术语。
          # 真正要拦的是"稳赚/包赚/一定涨"这类收益承诺。
          PATTERN="必涨|稳赚|包赚|保本高收益|一定涨|翻倍|年化.*%.*稳"

          HITS=$(grep -rnE "$PATTERN" --include="*.md" . || true)

          if [ -n "$HITS" ]; then
            echo "::error::对外文档中出现营销性收益承诺，请删除："
            echo "$HITS"
            exit 1
          else
            echo "对外文档未发现营销性收益承诺，合规通过。"
          fi
