# 疏影·知微 局部配置（可选；缺失时全部使用代码内默认值）
# 说明：本文件仅承载「可插拔协作模式」等新配置项；
# 其余配置（API Key / 数据源 / 模型）请通过 .env 或设置界面管理。

collaboration:
  mode: "debate"          # 可选：panel（专家组）/ debate（多空辩论）/ vote（投票收敛）
  panel:
    agents: ["technical", "fundamental", "news"]
    judge: "leader"
  debate:
    bull: "bull_researcher"
    bear: "bear_researcher"
    rounds: 3
  vote:
    agents: ["technical", "fundamental", "news", "sentiment"]
    threshold: 0.6

data:
  quality:
    jump_limit_pct: 50.0      # 单日波动>50% 记为异常
    min_pass_score: 70.0       # 质量评分及格线
    auto_fallback: true        # 数据质量不合格时自动尝试备源

performance:
  warn_startup_s: 20.0
  warn_module_ms: 5000.0
  warn_memory_mb: 1200.0

models:
  finance_engine: ""          # 金融专用模型（Ollama 名称，如 ling-3.0-flash-fin）；空=自动解析
  # 领域微调（可选）：见 scripts/lora_finetune/README.md

rag:
  top_k: 5                    # 混合检索返回条数
  alpha: 0.5                  # 重排权重：alpha*向量 + (1-alpha)*BM25
  min_score: 0.25             # 证据门控阈值：最高相关度低于此值 → 拒答（VeriFin 式）

stream:
  backend: "auto"             # auto（有 confluent-kafka 且 broker 可达→Kafka）/ memory
  bootstrap: "localhost:9092"
  window_seconds: 300         # 行情窗口聚合（秒）
