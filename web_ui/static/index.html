<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>疏影·知微 Web UI</title>
<style>
  :root { --bg:#0A0E17; --card:#131722; --border:#1E2530; --text:#E6EDF3;
          --sub:#8B949E; --accent:#00E5FF; --up:#00C853; --down:#FF1744; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:"Microsoft YaHei",sans-serif; padding:20px; }
  h1 { font-size:20px; margin-bottom:4px; }
  .sub { color:var(--sub); font-size:12px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input { background:#0A0E17; border:1px solid var(--border); border-radius:8px; color:var(--text);
          padding:8px 12px; font-size:14px; width:200px; }
  input:focus { outline:none; border-color:var(--accent); }
  button { background:var(--accent); color:#0A0E17; border:none; border-radius:8px;
           padding:8px 18px; font-size:14px; font-weight:bold; cursor:pointer; }
  button:hover { filter:brightness(1.15); }
  #chart { width:100%; height:380px; }
  .stats { display:flex; gap:24px; flex-wrap:wrap; font-size:13px; }
  .stat b { color:var(--accent); }
  .up { color:var(--up); } .down { color:var(--down); } .flat { color:var(--sub); }
  .disclaimer { color:var(--sub); font-size:11px; text-align:center; margin-top:12px; line-height:1.6; }
  #log { color:var(--sub); font-size:12px; margin-top:8px; min-height:18px; }
</style>
</head>
<body>
  <h1>🌙 疏影·知微 Web UI</h1>
  <div class="sub">开源金融数据分析工具 · 数据展示与历史统计（企业版混合模式）</div>

  <div class="card">
    <div class="row">
      <input id="code" placeholder="代码，如 SH600519 / AAPL / 000300" value="SH600519">
      <button onclick="load()">加载 K 线</button>
      <button onclick="runBacktest()">历史回测</button>
      <span id="log"></span>
    </div>
    <div id="stats" class="stats" style="margin-top:10px"></div>
  </div>

  <div class="card"><canvas id="chart"></canvas></div>

  <div class="disclaimer">
    本工具为开源金融数据分析软件，仅供研究学习使用。不提供任何证券投资分析、预测或建议，
    不构成任何投资建议，不是荐股软件。开发者不具备证券投资咨询业务资格。投资有风险，入市需谨慎。
  </div>

<script>
// 纯 JS Canvas K 线（无外部 CDN 依赖，离线可用）
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');

function drawKline(rows) {
  const W = canvas.width = canvas.offsetWidth * devicePixelRatio;
  const H = canvas.height = 380 * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);
  const cw = canvas.offsetWidth, ch = 380;
  ctx.clearRect(0, 0, cw, ch);
  if (!rows || !rows.length) {
    ctx.fillStyle = '#8B949E'; ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('请输入股票代码（如 SH600519 / AAPL / 000300）并点击加载', cw/2, ch/2);
    return;
  }
  const highs = rows.map(r => r.high), lows = rows.map(r => r.low);
  const hi = Math.max(...highs), lo = Math.min(...lows);
  const pad = 10, bodyW = cw / rows.length;
  const y = v => pad + (hi - v) / (hi - lo || 1) * (ch - 2 * pad);
  // 网格
  ctx.strokeStyle = '#1E2530'; ctx.lineWidth = 1;
  for (let g = 0; g <= 4; g++) {
    const gy = pad + g * (ch - 2 * pad) / 4;
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(cw, gy); ctx.stroke();
    const price = hi - (hi - lo) * g / 4;
    ctx.fillStyle = '#8B949E'; ctx.font = '10px sans-serif';
    ctx.fillText(price.toFixed(2), 2, gy - 3);
  }
  rows.forEach((r, i) => {
    const x = i * bodyW + bodyW / 2;
    const up = r.close >= r.open;
    const color = up ? '#00C853' : '#FF1744';
    ctx.strokeStyle = color; ctx.fillStyle = color;
    ctx.lineWidth = 1;
    // 影线
    ctx.beginPath(); ctx.moveTo(x, y(r.high)); ctx.lineTo(x, y(r.low)); ctx.stroke();
    // 实体
    const yo = y(r.open), yc = y(r.close);
    ctx.fillRect(x - bodyW * 0.35, Math.min(yo, yc), bodyW * 0.7, Math.max(Math.abs(yc - yo), 1));
  });
}

async function load() {
  const code = document.getElementById('code').value.trim();
  document.getElementById('log').textContent = '正在获取数据...';
  try {
    const res = await fetch('/api/analysis/' + encodeURIComponent(code));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    const s = j.data;
    const cls = s.period_change_pct == null ? 'flat' : (s.period_change_pct >= 0 ? 'up' : 'down');
    document.getElementById('stats').innerHTML =
      `<div class="stat">最新收盘 <b>${s.last_close}</b></div>` +
      `<div class="stat ${cls}">区间涨跌 <b>${s.period_change_pct == null ? '—' : s.period_change_pct + '%'}</b></div>` +
      `<div class="stat">最高 <b>${s.max}</b></div>` +
      `<div class="stat">最低 <b>${s.min}</b></div>` +
      `<div class="stat">K线数 <b>${s.bars}</b></div>` +
      `<div class="stat">数据源 <b>${s.source}</b></div>`;
    const rows = (await (await fetch('/api/bars/' + encodeURIComponent(code))).json()).bars;
    drawKline(rows);
    document.getElementById('log').textContent = '';
  } catch (e) {
    document.getElementById('log').textContent = '加载失败：' + e.message;
  }
}

async function runBacktest() {
  const code = document.getElementById('code').value.trim();
  document.getElementById('log').textContent = '回测中...';
  try {
    const res = await fetch('/api/backtest', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ticker: code})
    });
    const j = await res.json();
    const p = j.performance || {};
    document.getElementById('stats').innerHTML =
      `<div class="stat">年化收益 <b>${p.annual_return_pct ?? '—'}%</b></div>` +
      `<div class="stat">最大回撤 <b>${p.max_drawdown_pct ?? '—'}%</b></div>` +
      `<div class="stat">夏普 <b>${p.sharpe ?? '—'}</b></div>` +
      `<div class="stat">胜率 <b>${p.win_rate ?? '—'}%</b></div>` +
      `<div class="stat">交易 <b>${j.trades ?? '—'}</b> 次</div>`;
    document.getElementById('log').textContent = j.disclaimer || '';
  } catch (e) {
    document.getElementById('log').textContent = '回测失败：' + e.message;
  }
}

// 默认加载示例
window.addEventListener('DOMContentLoaded', () => {
  // 依赖 /api/bars 端点由后端提供（下方注册）
  document.getElementById('code').value = 'SH600519';
  load();
});
</script>
</body>
</html>
