# -*- coding: utf-8 -*-
name: CI 审计流水线

# 参考 quant-backtest-guard 的 CI 集成思路：每次策略/代码改动自动跑
# 全量测试 + 回测审计，阻止有严重偏差的策略进入实盘。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 全量测试 + 回测审计
    runs-on: ubuntu-latest
    env:
      STOCKAI_MOCK: "1"
      QT_QPA_PLATFORM: "offscreen"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # PyQt6 的 offscreen 平台插件在 ubuntu runner 上需要系统图形库，
      # 缺库会直接崩溃（qt.qpa.plugin: Could not load ... offscreen）。
      - name: 安装 Qt offscreen 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: 运行全量测试（mock 数据 + offscreen）
        run: python -B tests/run_all.py
      - name: 运行回测审计（8 条分级规则 + 诚实 vs 偏差）
        run: python -B scripts/ci_audit.py --json
